<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language Gender Experiment</title>

    <!-- jsPsych Libraries -->
    <script src="https://unpkg.com/jspsych@8.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
    <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" />
    <link rel="stylesheet" href="language-gender.css" />
  </head>

  <body></body>

  <script>
    // ---------------- Initialize jsPsych ----------------
    var jsPsych = initJsPsych({
      show_progress_bar: true,
      auto_update_progress_bar: true,
    });

    // ---------------- Determine API base URL ----------------
    const baseURL =
      window.location.hostname === "localhost"
        ? "http://localhost:3000"
        : "https://app-rq2ytaq6sa-uc.a.run.app";

    // ---------------- Load image + filename data ----------------
    let filenamesArray = [];
    let filepatharray = [];

    async function getFilenamesArray() {
      try {
        const response = await fetch("images.json");
        const data = await response.json();
        filenamesArray = data.filenames;
        filepatharray = data.paths;
        return filenamesArray;
      } catch (error) {
        console.error("Error fetching image list:", error);
        return [];
      }
    }

    // ---------------- Send Data to Server ----------------
    async function sendToServer(data) {
      const prolificPID = jsPsych.data.getURLVariable("PROLIFIC_PID");
      const studyID = jsPsych.data.getURLVariable("STUDY_ID");
      const sessionID = jsPsych.data.getURLVariable("SESSION_ID");

      const payload = {
        prolificPID: prolificPID || "Test_1",
        studyID: studyID || "Test_2",
        sessionID: sessionID || "Test_3",
        jspsychData: JSON.parse(data),
      };

      console.log("📤 Sending payload:", payload);

      try {
        // optional completion call
        await fetch(`${baseURL}/complete-experiment`, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        // main save
        const response = await fetch(`${baseURL}/submit-data`, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const text = await response.text();

        if (!response.ok) {
          console.error("❌ Server error:", text);
          alert("❌ Server error while saving data!");
          return false;
        } else {
          console.log("✅ Data saved successfully!");
          return true;
        }
      } catch (err) {
        console.error("🚫 Network error sending data:", err);
        alert("🚫 Network error while saving data!");
        return false;
      }
    }

    // ---------------- Start Experiment ----------------
    getFilenamesArray()
      .then(() => {
        console.log("Loaded image paths:", filepatharray);

        const timeline = [];

        const preload = {
          type: jsPsychPreload,
          images: filepatharray,
        };
        timeline.push(preload);

        const myInput =
          "<div class='input-div'><input id='Table' class='user-input' placeholder='Enter the object in your language!'></div>";

        const test_stimuli = filenamesArray.map((name, i) => ({
          stimulus: filepatharray[i],
          prompt: `${name} ${myInput}`,
        }));

        let languageGenders;

        function populateDropdown() {
          fetch("languages.json")
            .then((response) => response.json())
            .then((data) => {
              languageGenders = data;
              const dropdown = document.getElementById("languages");
              Object.keys(languageGenders).forEach((lang) => {
                const option = document.createElement("option");
                option.value = lang;
                option.textContent = lang;
                dropdown.appendChild(option);
              });
            });
        }

        let languageSelected = "None";

        const instructions = {
          type: jsPsychHtmlButtonResponse,
          stimulus: `
            <div class="start-para">
              <strong>Welcome to the Language Gender Experiment!</strong>
              <p>In this experiment, you will be shown various objects. For each object:</p>
              <p><strong>1.</strong> Enter the name that you think matches the object in your language.</p>
              <p><strong>2.</strong> Select the grammatical gender (Masculine, Feminine, Neuter) that best fits the object in your language.</p>
              <em class="italic">Select your language below</em>
            </div>
            <div>
              <select name="languages" class="dropdown jspsych-btn" id="languages"></select>
            </div>
          `,
          choices: ["Start"],
          button_html: [
            '<button class="jspsych-btn start-button" id="start-btn">%choice%</button>',
          ],
          on_load: function () {
            populateDropdown();
            document
              .getElementById("start-btn")
              .addEventListener("click", function () {
                languageSelected = document.getElementById("languages").value;
                document.body.innerHTML = "";

                const viewportHeight = window.innerWidth;
                const height = viewportHeight < 768 ? viewportHeight / 2 : 300;

                function CreateAndDisplayQuestion() {
                  const languageGenderArray = languageGenders[languageSelected];
                  let userInput;

                  const question = {
                    type: jsPsychImageButtonResponse,
                    stimulus: jsPsych.timelineVariable("stimulus"),
                    stimulus_height: height,
                    choices: languageGenderArray.concat(["Don't Know"]),
                    prompt: jsPsych.timelineVariable("prompt"),
                    button_html: languageGenderArray
                      .concat(["None"])
                      .map(
                        (choice) => `
                        <div>
                          <button class="jspsych-btn choice-button">%choice%</button>
                          <p></p>
                        </div>
                      `
                      ),
                    data: {
                      user_input: "Empty",
                      selected_gender: "",
                      choices: languageGenderArray.concat(["None"]),
                    },
                    on_load: function () {
  const inputDiv = document.querySelector(".input-div");
  const btnGroupDiv = document.getElementById(
    "jspsych-image-button-response-btngroup"
  );

  if (inputDiv && btnGroupDiv) {
    btnGroupDiv.parentNode.insertBefore(inputDiv, btnGroupDiv);
  }

  // capture value at the moment the participant clicks
  const inputField = document.getElementById("Table");
  const buttons = document.querySelectorAll(".jspsych-btn");

  buttons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const val = inputField ? inputField.value.trim() : "";
      // store the current text value directly in this trial’s data
      jsPsych.getCurrentTrial().data.user_input = val;
      console.log("💾 Captured input:", val);
    });
  });
},

on_finish: function (data) {
  data.selected_gender = data.choices[data.response];
  if (!data.user_input) {
    data.user_input = "No Input";
  }
},

                  };

                  const question_timeline = {
                    timeline: [question],
                    timeline_variables: test_stimuli,
                  };
                  timeline.push(question_timeline);
                }

                CreateAndDisplayQuestion();

                jsPsych = initJsPsych({
                  show_progress_bar: true,
                  auto_update_progress_bar: true,
                  on_finish: async function () {
  const ok = await sendToServer(jsPsych.data.get().json());

  // If saved, send participant back to Prolific
  if (ok) {
    const COMPLETION_CODE = "C1JK0MF6"; // <-- from your Prolific study
    const completionURL = `https://app.prolific.com/submissions/complete?cc=${COMPLETION_CODE}`;
    window.location.href = completionURL;
  } else {
    alert("❌ Data not saved. Please check your connection and click OK to retry.");
    // Optionally: retry sendToServer() here
  }
}
                });

                jsPsych.run(timeline);
              });
          },
        };

        jsPsych.run([instructions]);
      })
      .catch((error) => console.error("Error initializing experiment:", error));
  </script>
</html>
